# 从 fork 构建 Chatwoot EE 镜像并推到 GHCR。
#
# 为什么需要它：服务器上的对比实例（32.236.75.213:81）要跑本仓库的代码。
# 曾经的做法是把工作树 bind mount 进容器，结果是「后端来自 develop、前端产物
# 来自官方镜像」，Super Admin 因为缺 entrypoints/superadmin.scss 直接 500。
# 自建镜像让前后端来自同一次构建，版本天然一致。
#
# 对应上游的 publish_ee_docker.yml，差别：
#   - 只构建 linux/amd64（服务器是 x86_64），省掉一半时间
#   - 推 GHCR 而不是 DockerHub
#   - 沿用上游「保留 enterprise/ + 追加 CW_EDITION=ee」的做法
#     （官方 chatwoot/chatwoot:latest 就是 EE 镜像；foss 那份打的是 latest-ce）
#
# 用法：推 develop，或在 Actions 页面手动 Run workflow（可任选分支）。

name: Publish fork image (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - develop

env:
  IMAGE: ghcr.io/nothingp/chatwoot

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Chatwoot edition to EE
        run: echo -en '\nENV CW_EDITION="ee"' >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### 镜像已推送"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "服务器部署：\`deploy/upstream-comparison/deploy.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
